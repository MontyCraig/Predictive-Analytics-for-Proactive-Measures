[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predictive-analytics"
version = "1.0.0"
description = "Enterprise-grade time series forecasting and disruption prediction framework"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "MontyCraig" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<2.3",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<0.14",
  "scikit-learn>=1.6,<1.7",
  "scipy>=1.14,<1.15",
  "statsmodels>=0.14,<0.15",
  "prophet>=1.1,<1.2",
  "pmdarima>=2.0,<2.1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "tqdm>=4.67,<5",
  "joblib>=1.4,<2",
  "rich>=13.9,<14",
  "typer>=0.15,<1",
  "click>=8.1,<8.2",
]

[project.urls]
Homepage = "https://github.com/MontyCraig/Predictive-Analytics-for-Proactive-Measures"
Repository = "https://github.com/MontyCraig/Predictive-Analytics-for-Proactive-Measures"
Issues = "https://github.com/MontyCraig/Predictive-Analytics-for-Proactive-Measures/issues"
Documentation = "https://github.com/MontyCraig/Predictive-Analytics-for-Proactive-Measures#readme"

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.1.1",
  "pytest-mock==3.14.0",
  "hypothesis==6.151.9",
  "mypy==1.14.1",
  "types-requests==2.32.4.20260107",
  "black==24.10.0",
  "isort==5.13.2",
  "flake8==7.3.0",
  "pylint==3.3.6",
  "bandit==1.9.3",
  "pip-audit==2.7.3",
  "pre-commit==4.0.1",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.5.49",
]

[project.scripts]
predictive-analytics = "predictive_analytics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_analytics"]

[tool.hatch.build.targets.sdist]
include = ["src/predictive_analytics/**", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md"]
exclude = ["docs/**", "examples/**", "htmlcov/**", "output/**"]

[tool.black]
line-length = 99
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["predictive_analytics"]
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = [
  "matplotlib.*",
  "seaborn.*",
  "scipy.*",
  "statsmodels.*",
  "pmdarima.*",
  "prophet.*",
  "sklearn.*",
  "joblib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=predictive_analytics --cov-report=term-missing --cov-report=html --cov-fail-under=100"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src/predictive_analytics"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.",
  "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.flake8]
max-line-length = 99
extend-ignore = ["E203", "W503"]

[tool.pylint.messages_control]
disable = ["C0114", "C0115", "C0116", "R0903"]
